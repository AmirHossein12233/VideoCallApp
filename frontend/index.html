<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
VideoCallApp
</title>

<link rel="stylesheet"
href="style.css">

</head>


<body>


<!-- ======================
 LOGIN
====================== -->

<section id="loginPage"
class="page">


<div class="card">


<h1>
VideoCallApp
</h1>


<p>
تماس صوتی و تصویری آنلاین
</p>


<input
id="loginIdentifier"
placeholder="شناسه کاربر">


<button
id="loginButton">

ورود

</button>


<div id="loginMessage"></div>



<button
id="showRegisterButton"
class="link">

ساخت حساب جدید

</button>


</div>


</section>





<!-- ======================
 REGISTER
====================== -->


<section id="registerPage"
class="page hidden">


<div class="card">


<h1>
ساخت حساب
</h1>



<input
id="registerUserId"
placeholder="شناسه">


<input
id="registerPhone"
placeholder="شماره موبایل">



<input
id="registerName"
placeholder="نام نمایشی">



<button
id="registerButton">

ثبت نام

</button>



<div id="registerMessage"></div>



<button
id="showLoginButton"
class="link">

بازگشت

</button>


</div>


</section>







<!-- ======================
 APP
====================== -->


<section id="appPage"
class="hidden">



<header class="topbar">


<div class="profile">


<img
id="myAvatar"
class="avatar">


<div>

<b id="myName">
کاربر
</b>


<p id="myId">
شناسه:
</p>



<span id="myStatus">
آفلاین
</span>


</div>


</div>



<button
id="logoutButton">

خروج

</button>



</header>







<nav>


<button
id="refreshButton">

🔄 کاربران

</button>


</nav>







<main>



<div id="onlineBox">

در حال اتصال...

</div>





<section class="panel">


<h2>
کاربران
</h2>



<div id="usersList">


<div>
در حال دریافت کاربران...
</div>


</div>



</section>








<section
id="callPanel"
class="panel hidden">


<h2>
تماس
</h2>



<p id="callStatus">

در حال اتصال...

</p>



<div class="videos">



<video
id="remoteVideo"
autoplay
playsinline>
</video>




<video
id="localVideo"
autoplay
muted
playsinline>
</video>



</div>





<button
id="microphoneButton">

🎤 میکروفون

</button>



<button
id="cameraButton">

📷 دوربین

</button>



<button
id="hangupButton">

قطع تماس

</button>



<button
id="closeCallButton">

بستن

</button>



</section>



</main>
<!-- ======================
 INCOMING CALL
====================== -->


<div id="incomingCall"
class="modal hidden">


<div class="modal-box">


<h2>
📞 تماس ورودی
</h2>


<p>
کاربر با شما تماس گرفته است.
</p>



<button
id="acceptButton">

✅ پاسخ

</button>



<button
id="rejectButton">

❌ رد تماس

</button>



</div>


</div>





<!-- ======================
 TOAST
====================== -->


<div id="toast">

</div>





</section>





<script src="app.js"></script>


</body>

</html>
