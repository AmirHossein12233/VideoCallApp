<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VideoCallApp</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .hidden {
            display: none !important;
        }

        body {
            margin: 0;
            min-height: 100vh;
        }

        #authContainer,
        #appContainer {
            min-height: 100vh;
        }

        .startup {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Tahoma, Arial, sans-serif;
            color: white;
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- =========================
         Auth
    ========================== -->

    <div id="authContainer">

        <div class="auth-container">

            <div class="auth-card">

                <div class="logo">
                    📹
                </div>

                <h1>
                    VideoCallApp
                </h1>

                <p>
                    تماس تصویری و صوتی آنلاین
                </p>


                <!-- Login -->

                <div id="loginPanel">

                    <h2>
                        ورود
                    </h2>

                    <input
                        id="loginIdentifier"
                        type="text"
                        placeholder="شناسه یا شماره موبایل"
                        autocomplete="off"
                    >

                    <button
                        id="loginButton"
                        type="button"
                    >
                        ورود
                    </button>

                    <div
                        id="loginError"
                        class="error"
                    ></div>

                    <button
                        id="showRegisterButton"
                        type="button"
                    >
                        ثبت‌نام
                    </button>

                </div>


                <!-- Register -->

                <div
                    id="registerPanel"
                    class="hidden"
                >

                    <h2>
                        ثبت‌نام
                    </h2>

                    <input
                        id="registerUserId"
                        type="text"
                        placeholder="شناسه"
                        autocomplete="off"
                    >

                    <input
                        id="registerPhone"
                        type="tel"
                        placeholder="شماره موبایل"
                        autocomplete="off"
                    >

                    <input
                        id="registerName"
                        type="text"
                        placeholder="نام نمایشی"
                        autocomplete="off"
                    >

                    <button
                        id="registerButton"
                        type="button"
                    >
                        ثبت‌نام
                    </button>

                    <div
                        id="registerError"
                        class="error"
                    ></div>

                    <button
                        id="showLoginButton"
                        type="button"
                    >
                        بازگشت به ورود
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- =========================
         Main App
    ========================== -->

    <div
        id="appContainer"
        class="hidden"
    >

        <header class="topbar">

            <div class="profile-mini">

                <img
                    id="myAvatar"
                    src="icon.svg"
                    alt=""
                >

                <div>

                    <div id="myDisplayName">
                        کاربر
                    </div>

                    <div id="myUserId">
                        -
                    </div>

                    <div id="onlineStatus">
                        آنلاین
                    </div>

                </div>

            </div>


            <div class="top-actions">

                <button
                    id="contactsButton"
                    type="button"
                >
                    👥 مخاطبین
                </button>

                <button
                    id="profileButton"
                    type="button"
                >
                    👤 پروفایل
                </button>

                <button
                    id="settingsButton"
                    type="button"
                >
                    ⚙️ تنظیمات
                </button>

                <button
                    id="logoutButton"
                    type="button"
                >
                    خروج
                </button>

            </div>

        </header>


        <main class="main-container">

            <section class="search-section">

                <h2>
                    پیدا کردن کاربر
                </h2>

                <div class="search-box">

                    <input
                        id="targetUserId"
                        type="text"
                        placeholder="شناسه یا شماره موبایل"
                    >

                    <button
                        id="searchUserButton"
                        type="button"
                    >
                        جستجو
                    </button>

                </div>


                <div
                    id="searchResult"
                    class="search-result hidden"
                >

                    <img
                        id="searchUserAvatar"
                        src="icon.svg"
                        alt=""
                    >

                    <div>

                        <h3 id="searchUserName">
                            کاربر
                        </h3>

                        <div
                            id="searchUserIdentifier"
                        ></div>

                        <div
                            id="searchUserPhone"
                        ></div>

                    </div>


                    <div class="call-buttons">

                        <button
                            id="searchAudioCallButton"
                            type="button"
                        >
                            📞 تماس صوتی
                        </button>

                        <button
                            id="searchVideoCallButton"
                            type="button"
                        >
                            🎥 تماس تصویری
                        </button>

                    </div>

                </div>

            </section>


            <section class="users-section">

                <div class="section-header">

                    <h2>
                        کاربران
                    </h2>

                    <button
                        id="refreshUsersButton"
                        type="button"
                    >
                        🔄 بروزرسانی
                    </button>

                </div>

                <div id="usersList">
                </div>

            </section>


            <!-- Call -->

            <section
                id="callArea"
                class="call-area hidden"
            >

                <div
                    id="connectionStatus"
                >
                    آماده تماس
                </div>


                <div class="video-stage">

                    <div
                        id="remotePlaceholder"
                    >
                        در انتظار تصویر...
                    </div>

                    <video
                        id="remoteVideo"
                        autoplay
                        playsinline
                    ></video>

                    <video
                        id="localVideo"
                        autoplay
                        muted
                        playsinline
                    ></video>

                </div>


                <div class="call-controls">

                    <button
                        id="muteButton"
                        type="button"
                    >
                        🎤
                    </button>

                    <button
                        id="cameraButton"
                        type="button"
                    >
                        📹
                    </button>

                    <button
                        id="hangupButton"
                        type="button"
                    >
                        ☎️ پایان تماس
                    </button>

                </div>

            </section>

        </main>

    </div>


    <!-- =========================
         Incoming Call
    ========================== -->

    <div
        id="incomingCallModal"
        class="modal hidden"
    >

        <div class="modal-card">

            <img
                id="incomingCallerAvatar"
                src="icon.svg"
                alt=""
            >

            <h2>
                تماس ورودی
            </h2>

            <div id="incomingCaller">
                کاربر
            </div>

            <div class="incoming-buttons">

                <button
                    id="acceptCallButton"
                    type="button"
                >
                    پاسخ
                </button>

                <button
                    id="rejectCallButton"
                    type="button"
                >
                    رد تماس
                </button>

            </div>

        </div>

    </div>


    <!-- =========================
         Toast
    ========================== -->

    <div id="toast"></div>


    <!-- Scripts -->

    <script src="notifications.js"></script>
    <script src="app.js"></script>

</body>
</html>
