```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VideoCallApp</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>


<div class="container">

    <h1>
        📹 VideoCallApp
    </h1>


    <div class="box">

        <label>
            شناسه کاربر
        </label>

        <input
            id="userId"
            placeholder="مثلا amir"
        >


        <label>
            کد اتاق
        </label>

        <input
            id="roomId"
            placeholder="کد اتاق"
        >


        <div class="buttons">

            <button id="createRoom">
                ساخت اتاق
            </button>


            <button id="joinRoom">
                ورود به تماس
            </button>

        </div>


        <p id="status">
            آماده
        </p>


    </div>



    <div class="videos">


        <div class="video-box">

            <h3>
                دوربین من
            </h3>

            <video
                id="localVideo"
                autoplay
                muted
                playsinline>
            </video>

        </div>



        <div class="video-box">

            <h3>
                طرف مقابل
            </h3>

            <video
                id="remoteVideo"
                autoplay
                playsinline>
            </video>

        </div>


    </div>



    <div class="buttons call-buttons">

        <button id="startCall">
            شروع تماس
        </button>


        <button id="endCall">
            پایان تماس
        </button>

    </div>


</div>



<script src="app.js"></script>


</body>

</html>
```
