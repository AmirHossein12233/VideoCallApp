<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
VideoCallApp
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">


<!-- LOGIN -->

<section id="loginPage" class="page">


<div class="card">


<h1>
📞 VideoCallApp
</h1>


<input
id="loginIdentifier"
type="text"
placeholder="شناسه یا شماره موبایل">



<button id="loginButton">

ورود

</button>



<p id="loginMessage"></p>



<button
id="showRegisterButton"
class="secondary">

ساخت حساب جدید

</button>



</div>


</section>





<!-- REGISTER -->


<section id="registerPage"
class="page hidden">


<div class="card">


<h1>
ثبت نام
</h1>


<input
id="registerUserId"
type="text"
placeholder="شناسه کاربری">



<input
id="registerPhone"
type="text"
placeholder="شماره موبایل">



<input
id="registerName"
type="text"
placeholder="نام نمایشی">



<button id="registerButton">

ثبت نام

</button>



<p id="registerMessage"></p>



<button
id="showLoginButton"
class="secondary">

بازگشت به ورود

</button>



</div>


</section>





<!-- APP -->


<section id="appPage"
class="page hidden">



<div class="top">


<div class="profile">


<img
id="myAvatar"
class="avatar"
src=""
alt="avatar">



<div>


<h2 id="myName">
کاربر
</h2>



<p id="myId">
شناسه:
</p>



<p id="myStatus">
⚪ آفلاین
</p>



</div>


</div>



<button
id="logoutButton"
class="danger">

خروج

</button>



</div>





<div class="card">


<h2>
👥 کاربران
</h2>



<button
id="refreshButton">

🔄 بروزرسانی

</button>



<div id="usersList">


<div>
در حال دریافت کاربران...
</div>



</div>



</div>



</section>

<!-- INCOMING CALL -->

<div id="incomingCall"
class="modal hidden">


<div class="card">


<h2>
📞 تماس ورودی
</h2>


<p>
تماس جدید دریافت شد
</p>


<button id="acceptButton">

✅ قبول تماس

</button>



<button id="rejectButton"
class="danger">

❌ رد تماس

</button>


</div>


</div>






<!-- CALL PANEL -->


<div id="callPanel"
class="call-panel hidden">


<div class="videos">


<video
id="remoteVideo"
autoplay
playsinline>
</video>



<video
id="localVideo"
autoplay
playsinline
muted>
</video>



</div>




<p id="callStatus">

</p>





<div class="call-buttons">


<button
id="microphoneButton">

🎤

</button>




<button
id="cameraButton">

📷

</button>




<button
id="hangupButton"
class="danger">

📴 قطع تماس

</button>



</div>



</div>







<!-- TOAST -->


<div id="toast">

</div>



</div>





<script src="app.js"></script>


</body>

</html>
