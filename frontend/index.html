<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>VideoCallApp</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- LOGIN -->

<section id="loginPage" class="page auth-page">


<div class="card">


<h1>
VideoCallApp
</h1>

<p>
تماس صوتی و تصویری آنلاین
</p>


<input
id="loginIdentifier"
placeholder="شناسه یا شماره موبایل"
>


<button id="loginButton">
ورود
</button>


<div id="loginMessage"
class="message"></div>



<button id="showRegisterButton"
class="link">
ساخت حساب جدید
</button>


</div>


</section>





<!-- REGISTER -->


<section id="registerPage"
class="page auth-page hidden">


<div class="card">


<h1>
ساخت حساب
</h1>



<input
id="registerUserId"
placeholder="شناسه"
>



<input
id="registerPhone"
placeholder="شماره موبایل"
>



<input
id="registerName"
placeholder="نام نمایشی"
>



<button id="registerButton">
ثبت نام
</button>



<div id="registerMessage"
class="message"></div>


<button id="showLoginButton"
class="link">

بازگشت

</button>


</div>


</section>







<!-- APP -->


<section id="appPage"
class="page hidden">



<header class="top">


<div class="profile">


<img id="myAvatar">


<div>

<b id="myName">
کاربر
</b>


<span id="myId">
شناسه:
</span>


<small id="myStatus">
آفلاین
</small>


</div>


</div>



<button id="logoutButton">
خروج
</button>


</header>






<nav>


<button id="refreshButton">
کاربران
</button>


</nav>





<main>



<div id="onlineBox"
class="online">

در حال اتصال...

</div>





<section class="box">


<h2>
کاربران
</h2>


<div id="usersList">

<div>
در حال دریافت...
</div>

</div>


</section>







<!-- CALL PANEL -->


<section id="callPanel"
class="box hidden">


<h2>
تماس
</h2>


<div id="callStatus">
در حال اتصال
</div>




<div class="videos">


<video
id="remoteVideo"
autoplay
playsinline>
</video>



<video
id="localVideo"
autoplay
muted
playsinline>
</video>


</div>





<div class="controls">


<button id="microphoneButton">

🎤 میکروفون

</button>



<button id="cameraButton">

📷 دوربین

</button>



<button id="hangupButton">

📞 پایان

</button>



</div>



<button id="closeCallButton">

بستن

</button>



</section>







</main>








<!-- INCOMING CALL -->


<div id="incomingCall"
class="modal hidden">


<div class="card">


<h2>
تماس ورودی
</h2>


<p id="incomingName">

کاربر تماس گرفته

</p>


<button id="acceptButton">

پاسخ

</button>


<button id="rejectButton">

رد

</button>



</div>


</div>






<div id="toast">

</div>



</section>




<script src="app.js"></script>


</body>

</html>
