<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>پروفایل</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="page">


<div class="card">


<h1 class="title">
پروفایل من
</h1>


<div class="profile">


<img
id="avatar"
src="https://via.placeholder.com/70">


<div>

<div
class="profile-name"
id="name">

کاربر

</div>


<div
class="profile-id"
id="userid">

-

</div>


</div>


</div>



</div>




<div class="card">


<input
class="input"
id="displayName"
placeholder="نام جدید">



<button
class="button"
id="save">

ذخیره

</button>



<p
class="status"
id="message">

</p>



</div>



<a href="index.html">
بازگشت
</a>



</div>



<script>


const API="http://127.0.0.1:8000";


let userId =
localStorage.getItem("user_id");



async function loadProfile(){


if(!userId){

return;

}



let res =
await fetch(
`${API}/api/profile/${userId}`
);



let data =
await res.json();



if(data.user){


name.innerText =
data.user.display_name;


userid.innerText =
data.user.user_id;


avatar.src =
data.user.avatar ||
"https://via.placeholder.com/70";


displayName.value =
data.user.display_name;


}



}



save.onclick=async()=>{


await fetch(
`${API}/api/profile/${userId}`,
{

method:"PUT",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

display_name:
displayName.value,

avatar:""

})

});


message.innerText=
"ذخیره شد";


loadProfile();


};



loadProfile();


</script>


</body>

</html>
