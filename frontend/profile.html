<script>

const API_URL =
    "https://videocallapp-api.onrender.com";

const token =
    localStorage.getItem("auth_token");

const currentUserId =
    localStorage.getItem("user_id");


const avatar =
    document.getElementById("avatar");

const displayNameView =
    document.getElementById("displayNameView");

const userIdView =
    document.getElementById("userIdView");

const userIdText =
    document.getElementById("userIdText");

const phoneText =
    document.getElementById("phoneText");

const displayNameInput =
    document.getElementById("displayName");

const avatarInput =
    document.getElementById("avatarInput");

const message =
    document.getElementById("message");


// =====================================================
// LOAD PROFILE
// =====================================================

async function loadProfile() {

    try {

        const response =
            await fetch(
                `${API_URL}/api/me`,
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );


        const data =
            await response.json();


        if (response.status === 401) {

            logoutLocal();

            return;
        }


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "خطا در دریافت پروفایل"
            );

        }


        const user =
            data.user;


        displayNameView.innerText =
            user.display_name;


        userIdView.innerText =
            "@" + user.user_id;


        userIdText.innerText =
            user.user_id;


        phoneText.innerText =
            user.phone;


        displayNameInput.value =
            user.display_name;


        avatarInput.value =
            user.avatar || "";


        avatar.src =
            user.avatar ||
            "https://via.placeholder.com/70";


    } catch (error) {

        console.error(
            "Profile error:",
            error
        );


        message.innerText =
            "دریافت پروفایل ناموفق بود";

    }

}


// =====================================================
// SAVE PROFILE
// =====================================================

document
.getElementById("saveProfile")
.onclick =
    async () => {

        const displayName =
            displayNameInput
                .value
                .trim();


        const avatarUrl =
            avatarInput
                .value
                .trim();


        if (!displayName) {

            message.innerText =
                "نام نمایشی را وارد کنید";

            return;
        }


        try {

            const response =
                await fetch(
                    `${API_URL}/api/profile/${encodeURIComponent(currentUserId)}`,
                    {
                        method: "PUT",

                        headers: {
                            "Authorization":
                                `Bearer ${token}`,

                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            display_name:
                                displayName,

                            avatar:
                                avatarUrl

                        })
                    }
                );


            const data =
                await response.json();


            if (response.status === 401) {

                logoutLocal();

                return;
            }


            if (!response.ok) {

                throw new Error(
                    data.detail ||
                    "ذخیره تغییرات ناموفق بود"
                );

            }


            const user =
                data.user;


            displayNameView.innerText =
                user.display_name;


            displayNameInput.value =
                user.display_name;


            avatar.src =
                user.avatar ||
                "https://via.placeholder.com/70";


            avatarInput.value =
                user.avatar || "";


            message.innerText =
                "تغییرات با موفقیت ذخیره شد";


            setTimeout(() => {

                message.innerText =
                    "";

            }, 2500);


        } catch (error) {

            console.error(
                "Save profile error:",
                error
            );


            message.innerText =
                error.message ||
                "ذخیره تغییرات ناموفق بود";

        }

    };


// =====================================================
// LOGOUT LOCAL
// =====================================================

function logoutLocal() {

    localStorage.removeItem(
        "auth_token"
    );

    localStorage.removeItem(
        "user_id"
    );

    localStorage.removeItem(
        "call_target"
    );

    localStorage.removeItem(
        "pending_call"
    );

    localStorage.removeItem(
        "room_id"
    );

    location.href =
        "login.html";

}


// =====================================================
// START
// =====================================================

loadProfile();

</script>

</body>

</html>
