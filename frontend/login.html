```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ورود | VideoCallApp</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="page">

    <div class="card auth-box">

        <h1 class="title">
            📹 VideoCallApp
        </h1>

        <p class="subtitle">
            ورود یا ساخت حساب
        </p>


        <h3>
            ورود
        </h3>

        <input
            id="loginIdentifier"
            class="input"
            type="text"
            placeholder="شناسه کاربری">

        <input
            id="loginPassword"
            class="input"
            type="password"
            placeholder="رمز عبور">

        <button
            id="loginButton"
            class="button">

            ورود

        </button>


        <hr style="margin:25px 0;">


        <h3>
            ساخت حساب
        </h3>

        <input
            id="registerUserId"
            class="input"
            type="text"
            placeholder="شناسه کاربری">

        <input
            id="registerName"
            class="input"
            type="text"
            placeholder="نام نمایشی">

        <input
            id="registerPassword"
            class="input"
            type="password"
            placeholder="رمز عبور">

        <input
            id="registerPassword2"
            class="input"
            type="password"
            placeholder="تکرار رمز عبور">

        <button
            id="registerButton"
            class="button">

            ثبت نام

        </button>


        <p
            id="message"
            class="message">
        </p>

    </div>

</div>


<script>

const API =
    "https://videocallapp-api.onrender.com";


const message =
    document.getElementById("message");


function showMessage(
    text,
    success = false
) {

    message.innerText = text;

    message.style.color =
        success
            ? "#16a34a"
            : "#dc2626";
}


// =========================
// LOGIN
// =========================

document
.getElementById("loginButton")
.onclick = async () => {

    const identifier =
        document
        .getElementById("loginIdentifier")
        .value
        .trim();

    const password =
        document
        .getElementById("loginPassword")
        .value;


    if (!identifier || !password) {

        showMessage(
            "شناسه و رمز عبور را وارد کنید"
        );

        return;
    }


    try {

        const response =
            await fetch(
                `${API}/api/login`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        identifier,
                        password
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            showMessage(
                data.detail ||
                "ورود ناموفق بود"
            );

            return;
        }


        localStorage.setItem(
            "auth_token",
            data.token
        );

        localStorage.setItem(
            "user_id",
            data.user.user_id
        );


        showMessage(
            "ورود موفق بود",
            true
        );


        setTimeout(() => {
            location.href = "index.html";
        }, 500);


    } catch (error) {

        console.error(error);

        showMessage(
            "ارتباط با سرور برقرار نشد"
        );

    }
};


// =========================
// REGISTER
// =========================

document
.getElementById("registerButton")
.onclick = async () => {

    const user_id =
        document
        .getElementById("registerUserId")
        .value
        .trim();

    const display_name =
        document
        .getElementById("registerName")
        .value
        .trim();

    const password =
        document
        .getElementById("registerPassword")
        .value;

    const password2 =
        document
        .getElementById("registerPassword2")
        .value;


    if (
        !user_id ||
        !display_name ||
        !password
    ) {

        showMessage(
            "همه فیلدها را پر کنید"
        );

        return;
    }


    if (password.length < 6) {

        showMessage(
            "رمز عبور باید حداقل ۶ کاراکتر باشد"
        );

        return;
    }


    if (password !== password2) {

        showMessage(
            "تکرار رمز عبور صحیح نیست"
        );

        return;
    }


    try {

        const response =
            await fetch(
                `${API}/api/register`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        user_id,
                        display_name,
                        password
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            showMessage(
                data.detail ||
                "ثبت نام ناموفق بود"
            );

            return;
        }


        localStorage.setItem(
            "auth_token",
            data.token
        );

        localStorage.setItem(
            "user_id",
            data.user.user_id
        );


        showMessage(
            "ثبت نام موفق بود",
            true
        );


        setTimeout(() => {
            location.href = "index.html";
        }, 500);


    } catch (error) {

        console.error(error);

        showMessage(
            "ارتباط با سرور برقرار نشد"
        );

    }
};

</script>

</body>
</html>
```
