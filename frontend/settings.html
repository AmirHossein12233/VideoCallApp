<body>

<script>

if (
    !localStorage.getItem("auth_token") ||
    !localStorage.getItem("user_id")
) {

    location.href =
        "login.html";

}

</script>


<div class="page">


    <!-- HEADER -->

    <div class="card">

        <h1 class="title">
            ⚙️ تنظیمات

            </b>

        <div class="row">

            </b>

    <div class="card">

                checked>

</div>


<script>

const API_URL =
    "https://videocallapp-api.onrender.com";

const token =
    localStorage.getItem(
        "auth_token"
    );

const currentUser =
    localStorage.getItem(
        "user_id"
    );


const userIdElement =
    document.getElementById(
        "userId"
    );

const displayNameElement =
    document.getElementById(
        "displayName"
    );

const phoneElement =
    document.getElementById(
        "phone"
    );

const messageElement =
    document.getElementById(
        "message"
    );


const callNotification =
    document.getElementById(
        "callNotification"
    );

const ringtoneEnabled =
    document.getElementById(
        "ringtoneEnabled"
    );

const autoOpenCall =
    document.getElementById(
        "autoOpenCall"
    );


// =====================================================
// LOAD USER
// =====================================================

async function loadUser() {

    try {

        const response =
            await fetch(
                `${API_URL}/api/me`,
                {
                    method:
                        "GET",

                    headers: {
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );


        const data =
            await response.json();


        if (
            response.status === 401
        ) {

            forceLogout();

            return;
        }


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "خطا در دریافت حساب"
            );

        }


        const user =
            data.user;


        userIdElement.innerText =
            user.user_id;


        displayNameElement.innerText =
            user.display_name;


        phoneElement.innerText =
            user.phone;


    } catch (error) {

        console.error(
            error
        );


        messageElement.innerText =
            "دریافت اطلاعات حساب ناموفق بود";

    }

}


// =====================================================
// SETTINGS STORAGE
// =====================================================

function loadSettings() {

    const settingsRaw =
        localStorage.getItem(
            "app_settings"
        );


    if (!settingsRaw) {
        return;
    }


    try {

        const settings =
            JSON.parse(
                settingsRaw
            );


        callNotification.checked =
            settings.callNotification
            !== false;


        ringtoneEnabled.checked =
            settings.ringtoneEnabled
            !== false;


        autoOpenCall.checked =
            settings.autoOpenCall
            !== false;

    } catch (error) {

        console.error(
            error
        );

    }

}


function saveSettings() {

    const settings = {

        callNotification:
            callNotification.checked,

        ringtoneEnabled:
            ringtoneEnabled.checked,

        autoOpenCall:
            autoOpenCall.checked

    };


    localStorage.setItem(
        "app_settings",
        JSON.stringify(
            settings
        )
    );


    messageElement.innerText =
        "تنظیمات ذخیره شد";


    setTimeout(() => {

        messageElement.innerText =
            "";

    }, 2000);

}


// =====================================================
// SAVE BUTTON
// =====================================================

document
.getElementById(
    "saveSettings"
)
.onclick =
    saveSettings;


// =====================================================
// LOGOUT
// =====================================================

async function logout() {

    try {

        if (token) {

            await fetch(
                `${API_URL}/api/logout`,
                {
                    method:
                        "POST",

                    headers: {
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );

        }

    } catch (error) {

        console.error(
            "Logout error:",
            error
        );

    }


    forceLogout();

}


function forceLogout() {

    localStorage.removeItem(
        "auth_token"
    );

    localStorage.removeItem(
        "user_id"
    );

    localStorage.removeItem(
        "call_target"
    );

    localStorage.removeItem(
        "pending_call"
    );

    localStorage.removeItem(
        "room_id"
    );


    location.href =
        "login.html";

}


document
.getElementById(
    "logoutButton"
)
.onclick =
    logout;


// =====================================================
// START
// =====================================================

loadSettings();
loadUser();

</script>

</body>

</html>
