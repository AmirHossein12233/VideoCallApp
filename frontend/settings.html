<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تنظیمات | VideoCallApp</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="page">


<div class="topbar">

<button id="backButton">
← بازگشت
</button>


<h1>
⚙️ تنظیمات
</h1>


</div>



<div class="card">


<h2>
حساب کاربری
</h2>


<div class="profile-box">


<img
id="avatar"
class="profile-avatar"
src=""
>


<input
id="avatarInput"
placeholder="لینک عکس پروفایل"
/>



<input
id="displayName"
placeholder="نام نمایشی"
/>


<div class="info">

شناسه:
<span id="userId">
-
</span>

</div>



<div class="info">

شماره:
<span id="phone">
-
</span>

</div>


<button id="saveProfile">
💾 ذخیره پروفایل
</button>


</div>


</div>




<div class="card">


<h2>
🎤📷 دستگاه‌ها
</h2>


<button id="testMic">
بررسی میکروفون
</button>


<button id="testCamera">
بررسی دوربین
</button>



<p id="deviceResult">
-
</p>


</div>




<div class="card">


<h2>
اعلان‌ها
</h2>


<label>

<input
type="checkbox"
id="notifications"
checked
>

 اعلان تماس

</label>


</div>




<div class="card">


<button
id="logout"
class="danger"
>

🚪 خروج از حساب

</button>


</div>




<p id="message"></p>



</div>





<script>


const API_URL =
"https://videocallapp-api.onrender.com";



const userId =
localStorage.getItem(
"videoCallUserId"
);



if(!userId){

window.location.href =
"index.html";

}



const avatar =
document.getElementById(
"avatar"
);


const avatarInput =
document.getElementById(
"avatarInput"
);



const displayName =
document.getElementById(
"displayName"
);



const phone =
document.getElementById(
"phone"
);



const userIdBox =
document.getElementById(
"userId"
);



const message =
document.getElementById(
"message"
);





function showMessage(text){

message.textContent=text;

setTimeout(()=>{

message.textContent="";

},3000);

}





function defaultAvatar(name){

return (
"https://ui-avatars.com/api/?name="
+
encodeURIComponent(name)
);

}






async function loadProfile(){


try{


const res =
await fetch(

`${API_URL}/api/profile/${encodeURIComponent(userId)}`

);



const data =
await res.json();



const user =
data.user;



displayName.value =
user.display_name || "";



phone.textContent =
user.phone || "-";



userIdBox.textContent =
user.user_id;



avatar.src =
user.avatar ||
defaultAvatar(
user.display_name
);



avatarInput.value =
user.avatar || "";



}

catch(e){


showMessage(
"خطا در دریافت اطلاعات"
);


}



}







async function saveProfile(){



try{


const res =
await fetch(

`${API_URL}/api/profile/${encodeURIComponent(userId)}`,

{

method:"PUT",

headers:{

"Content-Type":
"application/json"

},


body:JSON.stringify({

display_name:
displayName.value.trim(),


avatar:
avatarInput.value.trim()


})


}

);



const data =
await res.json();



avatar.src =
data.user.avatar ||
defaultAvatar(
data.user.display_name
);



showMessage(
"پروفایل ذخیره شد ✅"
);



}

catch(e){


showMessage(
"خطا در ذخیره"
);


}



}






async function testMic(){


try{


const stream =
await navigator.mediaDevices.getUserMedia({

audio:true

});


stream.getTracks()
.forEach(
t=>t.stop()
);



deviceResult.textContent =
"✅ میکروفون فعال است";


}

catch{


deviceResult.textContent =
"❌ دسترسی میکروفون رد شد";


}


}






async function testCamera(){


try{


const stream =
await navigator.mediaDevices.getUserMedia({

video:true

});


stream.getTracks()
.forEach(
t=>t.stop()
);



deviceResult.textContent =
"✅ دوربین فعال است";


}

catch{


deviceResult.textContent =
"❌ دسترسی دوربین رد شد";


}


}







document
.getElementById(
"saveProfile"
)
.onclick =
saveProfile;



document
.getElementById(
"testMic"
)
.onclick =
testMic;



document
.getElementById(
"testCamera"
)
.onclick =
testCamera;



document
.getElementById(
"backButton"
)
.onclick =
()=>{

location.href="index.html";

};




document
.getElementById(
"logout"
)
.onclick =
()=>{


localStorage.clear();


location.href =
"index.html";


};





loadProfile();



</script>


</body>

</html>
