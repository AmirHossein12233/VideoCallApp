<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مخاطبین | VideoCallApp</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;
    min-height:100vh;

    background:#020617;
    color:white;

    font-family:
    Tahoma,
    Arial,
    sans-serif;
}


.container{

    width:100%;
    max-width:700px;

    margin:auto;

    padding:20px;

}



.header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:20px;

}


.header h1{

    margin:0;

    font-size:22px;

}



button{

    border:0;

    cursor:pointer;

    font-family:inherit;

}



.back{

    background:#1e293b;

    color:white;

    padding:10px 15px;

    border-radius:12px;

}



.card{

    background:#111827;

    border:1px solid #334155;

    border-radius:20px;

    padding:20px;

    margin-bottom:18px;

}



.add-box{

    display:flex;

    gap:10px;

}



input{

    flex:1;

    background:#020617;

    color:white;

    border:

    1px solid #475569;

    padding:13px;

    border-radius:12px;

    outline:none;

}



.add-btn{

    background:#2563eb;

    color:white;

    padding:0 20px;

    border-radius:12px;

}



.message{

    text-align:center;

    margin-top:12px;

    min-height:20px;

}



.success{

    color:#22c55e;

}


.error{

    color:#ef4444;

}



.title-row{

    display:flex;

    justify-content:space-between;

}



.count{

    color:#94a3b8;

}



.contact{

    display:flex;

    align-items:center;

    gap:12px;

    padding:15px 0;

    border-bottom:1px solid #334155;

}



.contact:last-child{

    border:none;

}



.avatar{

    width:55px;

    height:55px;

    border-radius:50%;

    background:#334155;

}



.info{

    flex:1;

}



.name{

    font-weight:bold;

}



.id{

    color:#94a3b8;

    font-size:13px;

}



.actions{

    display:flex;

    gap:5px;

}



.call{

    width:38px;

    height:38px;

    border-radius:10px;

    color:white;

}



.audio{

    background:#16a34a;

}



.video{

    background:#2563eb;

}



.empty{

    text-align:center;

    color:#94a3b8;

    padding:30px;

}



</style>

</head>


<body>


<div class="container">


<div class="header">

<h1>
👥 مخاطبین
</h1>


<button
class="back"
onclick="goBack()">

بازگشت

</button>


</div>



<div class="card">


<div class="add-box">


<input

id="identifier"

placeholder="شناسه یا شماره موبایل"

>


<button

class="add-btn"

onclick="addContact()">

افزودن

</button>


</div>


<div
id="message"
class="message">

</div>


</div>




<div class="card">


<div class="title-row">

<h3>
مخاطبین من
</h3>


<span
id="count"
class="count">

۰ نفر

</span>


</div>



<div id="list">

<div class="empty">

در حال دریافت...

</div>

</div>



</div>


</div>





<script>


const API_URL =
"https://videocallapp-api.onrender.com";



const userId =
localStorage.getItem(
"videoCallUserId"
);



if(!userId){

    location.href="index.html";

}



function avatar(name){


let letter =
(name || "U")
.charAt(0)
.toUpperCase();



return (

"data:image/svg+xml;charset=UTF-8," +

encodeURIComponent(`

<svg xmlns="http://www.w3.org/2000/svg"
width="100"
height="100">

<circle cx="50"
cy="50"
r="50"
fill="#334155"/>

<text x="50"
y="60"
text-anchor="middle"
font-size="45"
fill="white">

${letter}

</text>

</svg>

`)

);

}




function message(text,type=""){


const box =
document.getElementById(
"message"
);


box.textContent=text;


box.className =
"message " + type;


}




async function loadContacts(){


try{


const res =
await fetch(

`${API_URL}/api/contacts/${userId}`

);



const data =
await res.json();



const list =
document.getElementById(
"list"
);



const contacts =
data.contacts || [];



document.getElementById(
"count"
)
.textContent =
contacts.length +
" نفر";



if(!contacts.length){

list.innerHTML=

`
<div class="empty">

مخاطبی وجود ندارد

</div>
`;

return;

}



list.innerHTML="";



contacts.forEach(item=>{


const user =
item.user || item;



list.innerHTML +=

`

<div class="contact">


<img

class="avatar"

src="${
user.avatar ||
avatar(user.display_name)
}"

>


<div class="info">


<div class="name">

${user.display_name}

</div>


<div class="id">

${user.user_id}

</div>


</div>



<div class="actions">


<button

class="call audio"

onclick="callUser('${user.user_id}','audio')">

📞

</button>



<button

class="call video"

onclick="callUser('${user.user_id}','video')">

🎥

</button>


</div>


</div>

`;



});


}
catch(e){


message(
"خطا در دریافت مخاطبین",
"error"
);


}



}




async function addContact(){


const value =
document
.getElementById("identifier")
.value
.trim();



if(!value){

message(
"شناسه را وارد کنید",
"error"
);

return;

}



try{


const res =
await fetch(

`${API_URL}/api/contacts/${userId}`,

{

method:"POST",

headers:{

"Content-Type":
"application/json"

},


body:
JSON.stringify({

identifier:value

})


}

);



const data =
await res.json();



if(!res.ok)

throw new Error(
data.detail
);



message(
"مخاطب اضافه شد ✅",
"success"
);



document
.getElementById("identifier")
.value="";



loadContacts();



}
catch(e){


message(
e.message ||
"خطا",
"error"
);


}



}




function callUser(id,type){


localStorage.setItem(
"videoCallTargetUser",
id
);


localStorage.setItem(
"videoCallTargetType",
type
);



location.href="index.html";

}




function goBack(){


location.href="index.html";

}



loadContacts();



</script>


</body>

</html>
